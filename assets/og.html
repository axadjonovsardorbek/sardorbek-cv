<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OG image source</title>
<meta name="robots" content="noindex" />
<!--
  Source for /og.png (1200x630 social preview).
  Regenerate:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
    --headless --disable-gpu --hide-scrollbars \
    --window-size=1200,630 --screenshot=og.png \
    --virtual-time-budget=6000 assets/og.html
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #0b0a09;
    background-image: linear-gradient(160deg, #13100d 0%, #0b0a09 55%);
    color: #f1ece5;
    font-family: "IBM Plex Mono", monospace;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 78px 84px;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
    background-size: 72px 72px;
    -webkit-mask-image: radial-gradient(120% 90% at 12% 0%, #000 22%, transparent 72%);
  }
  .orb {
    position: absolute; border-radius: 50%; filter: blur(90px);
  }
  .orb.a {
    width: 620px; height: 620px; top: -230px; left: -160px;
    background: radial-gradient(circle, rgba(232,148,74,.30), transparent 68%);
  }
  .orb.b {
    width: 520px; height: 520px; bottom: -260px; right: -120px;
    background: radial-gradient(circle, rgba(246,205,151,.20), transparent 70%);
  }
  .inner { position: relative; z-index: 2; }
  .kicker {
    display: inline-flex; align-items: center; gap: 12px;
    font-size: 17px; letter-spacing: .22em; text-transform: uppercase;
    color: #e8944a; margin-bottom: 34px;
  }
  .kicker::before { content: ""; width: 34px; height: 2px; background: #e8944a; }
  h1 {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800; font-size: 104px; line-height: .92;
    letter-spacing: -.038em;
  }
  h1 .b {
    background: linear-gradient(180deg, #f1ece5 10%, rgba(241,236,229,.34) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub {
    margin-top: 30px; font-size: 25px; line-height: 1.45;
    color: #b9b1a6; max-width: 900px;
  }
  .chips { margin-top: 44px; display: flex; gap: 14px; }
  .chip {
    font-size: 19px; letter-spacing: .05em; color: #f1ece5;
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 999px; padding: 12px 22px;
  }
  .chip b { color: #e8944a; font-weight: 500; }
  .foot {
    position: absolute; left: 84px; right: 84px; bottom: 56px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 19px; letter-spacing: .1em; color: #8b8277; z-index: 2;
  }
  .foot .dot {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    background: #35c07a; margin-right: 11px; vertical-align: middle;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="orb a"></div>
  <div class="orb b"></div>

  <div class="inner">
    <div class="kicker">Go Backend Developer &middot; Team Lead</div>
    <h1>Sardorbek<br /><span class="b">Axadjonov</span></h1>
    <p class="sub">Microservices and event-driven serverless systems for travel, e-commerce, and fleet-management platforms.</p>
    <div class="chips">
      <span class="chip"><b>2+</b> yrs Go in production</span>
      <span class="chip"><b>700</b> RPS k6 on Knative</span>
      <span class="chip"><b>90%+</b> booking-path coverage</span>
    </div>
  </div>

  <div class="foot">
    <span><span class="dot"></span>OPEN TO BACKEND ROLES</span>
    <span>AXADJONOVSARDORBEK.UZ</span>
  </div>
</body>
</html>
